# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
# Press the prefix twice to send Ctrl+A to the active program.
bind C-a send-prefix

# Preserve the terminal's 256-color capability inside tmux so applications
# such as the Bash prompt can select colors through terminfo.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",screen-256color:Tc"

# Use Vim shortcuts
setw -g mode-keys vi

# Make `Ctrl+A r` reload the config file
unbind r
bind r source-file ~/.tmux.conf
